name: Build Windows Executable
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run package-win
      - uses: actions/upload-artifact@v4
        with:
          name: AirRedact-Windows-Installer
          path: dist/*.exe
