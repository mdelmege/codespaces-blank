<!DOCTYPE html><html><head><meta charset="UTF-8"><title>AirRedact</title>
<style>body{background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:32px;margin:0;}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;}
button{background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:12px 16px;font-weight:600;width:100%;cursor:pointer;}
button:hover{background:#4338ca;}.status{margin-top:16px;padding:12px;border-radius:8px;background:#090d16;display:none;word-break:break-all;}</style>
</head><body><div class="card"><h2>AirRedact Desktop</h2><p style="color:#94a3b8;font-size:13px;">Local zero-telemetry PDF metadata sanitizer.</p>
<button id="btn">Select PDF Document</button><div id="st" class="status"></div></div>
<script>const {ipcRenderer}=require("electron");const b=document.getElementById("btn"),s=document.getElementById("st");
b.onclick=async()=>{s.style.display="block";s.style.color="#94a3b8";s.textContent="Selecting...";const f=await ipcRenderer.invoke("select-file");
if(!f){s.textContent="No file selected.";return;}s.textContent="Sanitizing...";const r=await ipcRenderer.invoke("sanitize-pdf",f);
if(r.success){s.style.color="#34d399";s.textContent="Clean copy created: "+r.outputPath;}else{s.style.color="#f87171";s.textContent="Error: "+r.error;}};</script>
</body></html>
